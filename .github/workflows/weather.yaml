name: Send Weather Reports

on:
  repository_dispatch:
    types: [cron_weather_trigger] # This is the unique custom event name
  workflow_dispatch: # Keeps the manual run button working in the GitHub UI

jobs:
  send-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Send weather reports
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 15 --retry-max-time 180 \
            --request POST \
            --header "Authorization: Bearer $REPORTS_API_TOKEN" \
            "$REPORTS_API_URL"
        env:
          REPORTS_API_URL: ${{ secrets.REPORTS_API_URL }}
          REPORTS_API_TOKEN: ${{ secrets.REPORTS_API_TOKEN }}